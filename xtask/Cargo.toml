[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[dependencies]
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
percent-encoding = "2.3"
rand = "0.10"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking"] }
rustix = { version = "1.1.5", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
signal-hook = { version = "0.4.5", default-features = false }
tar = "0.4"
tempfile = "3"
toml = "0.9"
walkdir = "2"

[lints.rust]
unsafe_code = "forbid"
