name: correctness-security-deployments
on:
  push:
  pull_request:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    name: Rust / ${{ matrix.features || 'filesystem' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        features: ['', s3, gcs, azure, 's3,gcs', 's3,azure', 'gcs,azure', 's3,gcs,azure']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - run: rustup show
      - run: cargo build --locked --no-default-features --features '${{ matrix.features }}'
      - run: cargo build --release --locked --no-default-features --features '${{ matrix.features }}'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked --no-default-features --features '${{ matrix.features }}' -- -D warnings
      - run: cargo test --workspace --locked --no-default-features --features '${{ matrix.features }}'

  build:
    name: Build once / Linux tests / immutable image artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - name: Test the Linux musl build stage
        run: docker build --target tests .
      - name: Build the shared builder and runtime
        run: |
          docker build --target build -t obsidian-sync:builder .
          docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" -t obsidian-sync:local .
          python3 scripts/verify-image.py
      - name: Export the exact images for every downstream gate
        run: |
          mkdir -p .work/ci-images
          docker save obsidian-sync:local -o .work/ci-images/runtime.tar
          docker save obsidian-sync:builder -o .work/ci-images/builder.tar
          (cd .work/ci-images && sha256sum runtime.tar builder.tar > SHA256SUMS)
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: build-images
          path: .work/ci-images/
          retention-days: 1
          compression-level: 1
          if-no-files-found: error

  security:
    name: Security / secrets / documentation / supply chain
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with: {name: build-images, path: .work/ci-images}
      - name: Verify and load shared images; never rebuild scanned artifacts
        run: |
          (cd .work/ci-images && sha256sum -c SHA256SUMS)
          docker load -i .work/ci-images/runtime.tar
          docker load -i .work/ci-images/builder.tar
      - run: cargo install cargo-audit --version 0.22.1 --locked
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo audit && cargo deny check
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 scripts/sync-generated.py --check && python3 scripts/docs.py check
      - name: Scan Rust, source/history secrets, exact runtime and builder
        env:
          SYNC_SECURITY_BUILDER_IMAGE: obsidian-sync:builder
        run: scripts/scan-security.sh
      - name: Verify the runtime-to-release content binding
        run: python3 scripts/verify-release.py --image obsidian-sync:local --scan-report .work/security/trivy.json
      - name: Scan every declared public build/test/scanner image
        if: always()
        run: python3 scripts/scan-supply-chain.py --platform linux/amd64
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: security-reports
          path: .work/security/
          retention-days: 14
          if-no-files-found: error

  integration:
    name: Real clients / S3 / reference CouchDB / disposable deployments
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with: {name: build-images, path: .work/ci-images}
      - name: Verify and load the tested runtime
        run: |
          (cd .work/ci-images && sha256sum -c SHA256SUMS)
          docker load -i .work/ci-images/runtime.tar
      - run: |
          go install sigs.k8s.io/kustomize/kustomize/v5@v5.8.1
          go install sigs.k8s.io/kind@v0.33.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: tests/compat/package-lock.json
      - run: scripts/validate-deployments.sh
      - run: python3 scripts/test-livesync.py
      - run: scripts/test-s3.sh
      - run: python3 scripts/test-reference-couch.py
      - run: npm audit --prefix tests/compat --audit-level=low
      - run: scripts/smoke-compose.sh
      - run: python3 scripts/test-livesync.py --image obsidian-sync:local
      - run: scripts/smoke-kubernetes.sh

  sbom:
    name: SPDX / CycloneDX / source and image materials
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with: {name: build-images, path: .work/ci-images}
      - name: Verify and load exactly the scanned/tested images
        run: |
          (cd .work/ci-images && sha256sum -c SHA256SUMS)
          docker load -i .work/ci-images/runtime.tar
          docker load -i .work/ci-images/builder.tar
      - name: Generate inventories and bound materials offline
        run: python3 scripts/generate-sbom.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: sbom-materials
          path: .work/sbom/
          retention-days: 30
          if-no-files-found: error
