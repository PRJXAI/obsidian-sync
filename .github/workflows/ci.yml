name: correctness-security-deployments
on:
  push:
  pull_request:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested Linux amd64 application after all Required CI gates
        type: boolean
        default: false
      redistribution_reviewed:
        description: Confirm application-specific notices and source arrangements for this revision
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.run_id || 'checks' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish }}
jobs:
  rust:
    name: Rust / ${{ matrix.features || 'filesystem' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        features: ['', s3, gcs, azure, 's3,gcs', 's3,azure', 'gcs,azure', 's3,gcs,azure']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - run: rustup show
      - run: cargo build --locked --no-default-features --features '${{ matrix.features }}'
      - run: cargo build --release --locked --no-default-features --features '${{ matrix.features }}'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked --no-default-features --features '${{ matrix.features }}' -- -D warnings
      - run: cargo test --workspace --locked --no-default-features --features '${{ matrix.features }}'

  build:
    name: Build once / Linux tests / immutable image artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - name: Test build-context privacy with synthetic excluded-file canaries
        run: cargo xtask test-build-context
      - name: Test Linux musl and build/export the exact runtime and builder
        run: cargo xtask build-ci-images
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: build-images
          path: |
            .work/ci-images/runtime.tar
            .work/ci-images/builder.tar
            .work/ci-images/SHA256SUMS
          retention-days: 1
          compression-level: 1
          if-no-files-found: error

  security:
    name: Security / secrets / documentation / supply chain
    needs: [build, sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with: {name: build-images, path: .work/ci-images}
      - name: Verify and load shared images; never rebuild scanned artifacts
        run: cargo xtask load-ci-images
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with: {name: sbom-materials, path: .work/sbom}
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo audit
      - run: cargo deny check
      - run: cargo test --locked -p xtask
      - run: cargo xtask sync-generated --check
      - run: cargo xtask docs check
      - name: Audit Rust and scan minimized source/history inputs
        run: cargo xtask scan-sources
      - name: Grype scans the exact source/runtime/builder Syft SBOMs offline
        run: cargo xtask scan-sbom --sbom-dir .work/sbom
      - name: Verify bound SBOM/report/config/layer runtime content
        if: always()
        run: cargo xtask verify-release --image obsidian-sync:local --scan-report .work/sbom/runtime.scan.json
      - name: Syft catalogs every declared image; Grype scans each SBOM offline
        if: always()
        run: cargo xtask scan-supply-chain --platform linux/amd64
      - name: Retain every finding and exact owner-acceptance accounting
        if: always()
        run: cargo xtask findings-ledger --platform linux/amd64 --source-revision "$GITHUB_SHA"
      - name: Assemble private dependency baseline from bound image/build reports
        if: always()
        run: cargo xtask dependency-baseline --platform linux/amd64
      - name: Prepare allowlisted public summaries, never raw matches or logs
        id: publish
        if: always()
        run: cargo xtask publish-security-summary --source-revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always() && steps.publish.outcome == 'success'
        with:
          name: security-reports
          path: .work/public-security/
          retention-days: 14
          if-no-files-found: error

  integration:
    name: Real clients / S3 / disposable deployments
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOTOOLCHAIN: go1.27.3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with: {name: build-images, path: .work/ci-images}
      - name: Verify and load the tested runtime
        run: cargo xtask load-ci-images --runtime-only
      - run: cargo xtask install-deployment-tools
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: tests/compat/package-lock.json
      - run: scripts/validate-deployments.sh
      - run: cargo xtask test-livesync
      - run: scripts/test-s3.sh
      - run: npm audit --prefix tests/compat --audit-level=low
      - run: scripts/smoke-compose.sh
      - run: cargo xtask test-livesync --image obsidian-sync:local
      - run: scripts/smoke-kubernetes.sh

  sbom:
    name: SPDX / CycloneDX / source and image materials
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with: {name: build-images, path: .work/ci-images}
      - name: Verify and load exactly the scanned/tested images
        run: cargo xtask load-ci-images
      - name: Generate inventories and bound materials offline
        run: cargo xtask generate-sbom --runtime-archive "$PWD/.work/ci-images/runtime.tar" --builder-archive "$PWD/.work/ci-images/builder.tar"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: sbom-materials
          path: |
            .work/sbom/source.cdx.json
            .work/sbom/source.spdx.json
            .work/sbom/source.syft.json
            .work/sbom/runtime.cdx.json
            .work/sbom/runtime.spdx.json
            .work/sbom/runtime.syft.json
            .work/sbom/builder.cdx.json
            .work/sbom/builder.spdx.json
            .work/sbom/builder.syft.json
            .work/sbom/native-toolchain.txt
            .work/sbom/materials.json
          retention-days: 30
          if-no-files-found: error

  required-ci:
    name: Required CI
    if: always()
    needs: [rust, build, security, integration, sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - name: Fail on any failed, skipped, canceled or missing dependency
        env:
          REQUIRED_JOB_RESULTS: ${{ toJSON(needs) }}
        run: cargo xtask ci-gate

  publish:
    name: Publish exact tested application / provenance
    needs: [required-ci, build, sbom]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish && inputs.redistribution_reviewed && needs['required-ci'].result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with: {name: build-images, path: .work/ci-images}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with: {name: sbom-materials, path: .work/sbom}
      - run: cargo xtask load-ci-images
      - name: Fresh bound analysis before registry credentials; no raw-report artifact transfer
        run: cargo xtask scan-sbom --sbom-dir .work/sbom
      - run: cargo xtask verify-release --image obsidian-sync:local --scan-report .work/sbom/runtime.scan.json
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote exact tested bytes without rebuilding
        env:
          PUBLISH_REQUIRED_CI_RESULT: ${{ needs['required-ci'].result }}
          PUBLISH_REDISTRIBUTION_APPROVED_SHA: ${{ github.sha }}
        run: cargo xtask publish-image --source-revision "$GITHUB_SHA"
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-checksums: .work/published-application/subjects.checksums
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: published-application
          path: |
            .work/published-application/release.json
            .work/published-application/subjects.checksums
          if-no-files-found: error
