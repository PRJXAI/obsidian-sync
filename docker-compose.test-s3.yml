# Disposable integration test service, never a production deployment.
services:
  object-store:
    image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      RUSTFS_ACCESS_KEY: ${TEST_S3_ACCESS_KEY:?Generated by scripts/test-s3.sh}
      RUSTFS_SECRET_KEY: ${TEST_S3_SECRET_KEY:?Generated by scripts/test-s3.sh}
      RUSTFS_CONSOLE_ENABLE: 'false'
    command: ["/data"]
    ports: ["127.0.0.1::9000"]
    tmpfs:
      - /data:rw,nosuid,nodev,uid=10001,gid=10001,mode=0700,size=512m
      - /logs:rw,nosuid,nodev,uid=10001,gid=10001,mode=0700,size=16m
      - /tmp:rw,nosuid,nodev,uid=10001,gid=10001,mode=0700,size=32m
    mem_limit: 1g
    pids_limit: 256
