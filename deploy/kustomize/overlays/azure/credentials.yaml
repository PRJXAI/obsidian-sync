apiVersion: apps/v1
kind: Deployment
metadata:
  name: obsidian-sync
spec:
  template:
    spec:
      containers:
        - name: server
          env:
            - {name: AZURE_SAS_TOKEN_FILE, value: /run/secrets/storage/sas-token}
          volumeMounts:
            - {name: credentials, mountPath: /run/secrets/storage, readOnly: true}
      volumes:
        - name: credentials
          secret:
            secretName: sync-azure-credentials
            defaultMode: 0440
