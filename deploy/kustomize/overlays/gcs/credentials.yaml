apiVersion: apps/v1
kind: Deployment
metadata:
  name: obsidian-sync
spec:
  template:
    spec:
      containers:
        - name: server
          env:
            - {name: GCS_SERVICE_ACCOUNT_FILE, value: /run/secrets/storage/service-account.json}
          volumeMounts:
            - {name: credentials, mountPath: /run/secrets/storage, readOnly: true}
      volumes:
        - name: credentials
          secret:
            secretName: sync-gcs-credentials
            defaultMode: 0440
