apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: obsidian-sync
spec:
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    # Narrow this to the chosen provider's ranges or an egress gateway before production.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [169.254.0.0/16, 127.0.0.0/8]
      ports: [{protocol: TCP, port: 443}]
