apiVersion: apps/v1
kind: Deployment
metadata:
  name: obsidian-sync
spec:
  template:
    spec:
      containers:
        - name: server
          env:
            - {name: S3_ACCESS_KEY_FILE, value: /run/secrets/storage/access-key}
            - {name: S3_SECRET_KEY_FILE, value: /run/secrets/storage/secret-key}
          volumeMounts:
            - {name: credentials, mountPath: /run/secrets/storage, readOnly: true}
      volumes:
        - name: credentials
          secret:
            secretName: sync-s3-credentials
            defaultMode: 0440
