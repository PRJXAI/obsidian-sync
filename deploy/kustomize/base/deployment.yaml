apiVersion: apps/v1
kind: Deployment
metadata:
  name: obsidian-sync
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: obsidian-sync}
  template:
    metadata:
      labels: {app: obsidian-sync}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: server
          image: obsidian-sync:local
          imagePullPolicy: IfNotPresent
          args: [serve]
          env:
            - {name: SYNC_CONFIG, value: /etc/obsidian-sync/config.toml}
            - {name: TMPDIR, value: /tmp}
          ports:
            - {name: http, containerPort: 8080}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi, ephemeral-storage: 128Mi}
            limits: {cpu: '2', memory: 2Gi, ephemeral-storage: 2Gi}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /etc/obsidian-sync, readOnly: true}
            - {name: temporary, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: sync-data}
        - name: config
          configMap: {name: sync-config}
        - name: temporary
          emptyDir: {sizeLimit: 1100Mi}
